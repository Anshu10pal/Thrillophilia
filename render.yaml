services:
  - type: web
    name: thrillophilia
    env: python
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install --no-cache-dir -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false   # https://keygateway.arshnivlabs.com/v1
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: OPENROUTE_API_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGCHAIN_PROJECT
        value: Thrillophilia-TripPlanner
